name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Tag and release if version is new
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '^\s*<version>\K[^<]+' pom.xml | head -1)
          if [[ -z "$VERSION" ]]; then
            echo "::error::no version line found in pom.xml"; exit 1
          fi
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "version $VERSION is SNAPSHOT — skip release"
            echo "publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — skip release"
            echo "publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
          echo "publish=true" >> $GITHUB_OUTPUT

      - name: Set up GPG signing key
        if: steps.check_release.outputs.publish == 'true' && env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import --pinentry-mode loopback || true

      - name: Deploy to Maven Central
        if: steps.check_release.outputs.publish == 'true' && env.MAVEN_CENTRAL_TOKEN != ''
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]]; then
            mvn clean deploy -DskipTests -P release \
              -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"
          else
            echo "No GPG_PRIVATE_KEY found; deploying without signing profile"
            mvn clean deploy -DskipTests
          fi
